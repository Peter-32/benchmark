<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 1200px;
        }

        .gallery img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <h1>My Images</h1>

    <div class="gallery">
        <img src="my_inject_zvt_benchmark.png" alt="Image 1">
        <img src="my_inject_zvz_benchmark.png" alt="Image 2">
        <img src="my_inject_zvp_benchmark.png" alt="Image 3">
        <img src="my_unspent_zvt_benchmark.png" alt="Image 4">
        <img src="my_unspent_zvz_benchmark.png" alt="Image 5">
        <img src="my_unspent_zvp_benchmark.png" alt="Image 6">
        <!-- <img src="7.png" alt="Image 7">
        <img src="8.png" alt="Image 8">
        <img src="9.png" alt="Image 9">
        <img src="10.png" alt="Image 10"> -->
    </div>

</body>
</html>
